name: Verify image without publishing
on:
  push:
    branches: ['verify/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-runtime-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      compose_version: ${{ steps.compose-version.outputs.version }}
      base_image: ${{ steps.base.outputs.base_image }}
      dependency_digest: ${{ steps.base.outputs.dependency_digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: latest
      - name: Record Compose version for verification jobs
        id: compose-version
        run: version=$(docker compose version --short) && echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-deps
          path: runtime-deps.json
          if-no-files-found: error
          retention-days: 1
  verify:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      BASE_IMAGE: ${{ needs.resolve.outputs.base_image }}
      IMAGE: agent-runtime:test
      DEPENDENCY_DIGEST: ${{ needs.resolve.outputs.dependency_digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the Compose version tested by resolve
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: ${{ needs.resolve.outputs.compose_version }}
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-deps
          path: .
      - name: Verify resolved dependency artifact
        run: python3 scripts/verify_dependency_lock.py
      - name: Split independent component inputs
        run: python3 scripts/split_dependencies.py --manifest runtime-deps.json --output .build-inputs
      - name: Build with immutable base; never push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          provenance: false
          sbom: false
          load: true
          tags: agent-runtime:test
          build-args: BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha,version=2,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,version=2,scope=runtime-${{ matrix.arch }},mode=max
      - name: Exercise fresh home and tools without real credentials
        run: sh tests/smoke.sh
      - name: Prove independent CLI layers using a fresh builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/layer_delta_probe.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: layer-delta-${{ matrix.arch }}
          path: layer-delta.json
          if-no-files-found: error
          retention-days: 7
