# Share download caches only among trusted containers; installed tools stay private.
services:
  runtime:
    environment:
      NPM_CONFIG_CACHE: /shared/caches/npm
      GOMODCACHE: /shared/caches/go-mod
      UV_CACHE_DIR: /shared/caches/uv
      UV_LINK_MODE: copy
    volumes:
      - type: volume
        source: download-cache
        target: /shared/caches
        read_only: false
        volume:
          nocopy: true
    # Overriding entrypoint clears the image CMD; keep the daemon command explicit.
    command: [multica, daemon, start, --foreground, --no-auto-update, --no-auto-reload, --workspaces-root, /home/agent/workspace]
    # Reject symlinks; initialize only cache directories owned by 1000:1000 at 0750.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/python3 -I - <<'PY'
        import os, stat
        flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
        shared = os.open('/shared', flags)
        root = os.open('caches', flags, dir_fd=shared)
        try:
            names = ('npm', 'go-mod', 'uv')
            for name in names:
                try:
                    mode = os.stat(name, dir_fd=root, follow_symlinks=False).st_mode
                except FileNotFoundError:
                    continue
                if not stat.S_ISDIR(mode):
                    raise SystemExit('Refusing non-directory cache: ' + name)
            for name in names:
                try:
                    os.mkdir(name, 0o750, dir_fd=root)
                except FileExistsError:
                    pass
                fd = os.open(name, flags, dir_fd=root)
                try:
                    os.fchown(fd, 1000, 1000)
                    os.fchmod(fd, 0o750)
                finally:
                    os.close(fd)
        finally:
            os.close(root)
            os.close(shared)
        PY
        exec /usr/local/bin/agent-bootstrap "$$@"
      - shared-cache-bootstrap
volumes:
  download-cache:
    name: ${SHARED_CACHE_VOLUME:-agent-runtime-download-cache}
