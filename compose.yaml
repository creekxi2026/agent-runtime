name: ${COMPOSE_PROJECT_NAME:?请在 .env 填写唯一实例名}
services:
  runtime:
    init: false
    image: ${RUNTIME_IMAGE:-ghcr.io/creekxi2026/agent-runtime:latest}
    # root 仅初始化目录；随后降为 1000:1000 并清除 capabilities。
    user: "0:0"
    working_dir: /home/agent
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-}
      MULTICA_BOOTSTRAP_TOKEN: ${MULTICA_BOOTSTRAP_TOKEN:-}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_BRAND: ${LARK_BRAND:-feishu}
      MULTICA_DAEMON_DEVICE_NAME: ${COMPOSE_PROJECT_NAME}
      MULTICA_AGENT_RUNTIME_NAME: ${COMPOSE_PROJECT_NAME}
      # 仅透传显式设置；未设置时由 Multica 决定并发数。
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS:
    volumes:
      # HOME 按实例隔离；nocopy 避免复制镜像内的 HOME。
      - type: volume
        source: agent-home
        target: /home/agent
        read_only: false
        volume:
          nocopy: true
    read_only: false
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP]
    # 仅放宽本容器的 seccomp/AppArmor，以兼容 Codex 内层沙箱。
    # 不启用 privileged 或 SYS_ADMIN，不修改宿主机全局设置。
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: ${MEMORY_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}
    pids_limit: 512
    restart: unless-stopped
volumes:
  agent-home:
    name: ${HOME_VOLUME:-${COMPOSE_PROJECT_NAME}-home}
