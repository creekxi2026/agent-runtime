# 启动：docker compose up -d
# 先替换此 Compose，再拉取最新镜像并重建；DATA_DIR 保持原宿主机目录。
name: ${COMPOSE_PROJECT_NAME:?请在 .env 填写唯一实例名}
services:
  runtime:
    init: false
    image: ghcr.io/creekxi2026/agent-runtime:${IMAGE_TAG:-latest}
    # 仅入口初始化使用 root；随后降为 1000:1000，并清除全部 capabilities。
    user: "0:0"
    working_dir: /home/agent
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-}
      MULTICA_BOOTSTRAP_TOKEN: ${MULTICA_BOOTSTRAP_TOKEN:-}
      CODEX_SHARED_DIR: /shared/codex
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_BRAND: ${LARK_BRAND:-feishu}
      PLAYWRIGHT_WS_ENDPOINT: ${PLAYWRIGHT_WS_ENDPOINT:-}
      MULTICA_DAEMON_DEVICE_NAME: ${COMPOSE_PROJECT_NAME}
      MULTICA_AGENT_RUNTIME_NAME: ${COMPOSE_PROJECT_NAME}
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /home/agent
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: ${SHARED_CODEX_DIR:?请在 .env 设置共享 Codex 专用配置目录}
        target: /shared/codex
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${SHARED_SKILLS_DIR:?请在 .env 设置共享 skills 目录}
        target: /home/agent/.agents/skills
        read_only: false
        bind:
          create_host_path: true
    # 共享配置和 skills 可写；宿主权限须允许 UID/GID 1000:1000 写入。
    read_only: false
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP]
    # 放宽本容器的 seccomp/AppArmor 过滤，以兼容 Codex 的内层 Linux 沙箱。
    # 不启用 privileged，不增加 SYS_ADMIN，不修改宿主机全局设置。
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: ${MEMORY_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}
    pids_limit: 512
    restart: unless-stopped
