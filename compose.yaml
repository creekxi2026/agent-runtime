name: ${COMPOSE_PROJECT_NAME:?Set a unique instance name in .env}
services:
  runtime:
    init: false
    image: ${RUNTIME_IMAGE:-ghcr.io/creekxi2026/agent-runtime:latest}
    # Root initializes directories, then drops to 1000:1000 and clears capabilities.
    user: "0:0"
    working_dir: /home/agent
    environment:
      MULTICA_SERVER_URL: ${MULTICA_SERVER_URL:-}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-}
      MULTICA_BOOTSTRAP_TOKEN: ${MULTICA_BOOTSTRAP_TOKEN:-}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_BRAND: ${LARK_BRAND:-feishu}
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
      GOSUMDB: ${GOSUMDB:-sum.golang.org}
      GOPRIVATE: ${GOPRIVATE:-}
      MULTICA_DAEMON_DEVICE_NAME: ${COMPOSE_PROJECT_NAME}
      MULTICA_AGENT_RUNTIME_NAME: ${COMPOSE_PROJECT_NAME}
      # Pass only explicit overrides; otherwise Multica selects concurrency.
      MULTICA_DAEMON_MAX_CONCURRENT_TASKS:
    volumes:
      # Private HOME per instance; nocopy avoids copying the image HOME.
      - type: volume
        source: agent-home
        target: /home/agent
        read_only: false
        volume:
          nocopy: true
    read_only: false
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETPCAP]
    # Relax only this container's seccomp/AppArmor for Codex's inner sandbox.
    # No privileged mode, SYS_ADMIN or global host changes.
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    mem_limit: ${MEMORY_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}
    pids_limit: 512
    restart: unless-stopped
volumes:
  agent-home:
    name: ${HOME_VOLUME:-${COMPOSE_PROJECT_NAME}-home}
